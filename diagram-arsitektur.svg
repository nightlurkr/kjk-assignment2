<!-- kotak serangan yang diuji, di ruang kosong tengah -->
<rect x="640" y="300" width="370" height="250" rx="8" fill="#fdf0ec" stroke="#9d2c13" stroke-width="2"/>
<text x="660" y="330" font-size="17" font-weight="bold" fill="#9d2c13">BLOCKED ATTACKS · dua uji</text>

<text x="660" y="362" font-size="15" font-weight="bold" fill="#16191c">A. Akses langsung ke database</text>
<text x="660" y="384" font-size="14" fill="#16191c">attacker .66 → db 172.16.20.10:3306</text>
<g stroke="#9d2c13" stroke-width="2.5" stroke-dasharray="9 7" fill="none" marker-end="url(#arx)">
  <path d="M662 398 L880 398"/>
</g>
<text x="890" y="403" font-size="18" font-weight="bold" fill="#9d2c13">✗</text>
<text x="660" y="422" font-size="13.5" fill="#9d2c13">Gagal di r2 dan sekali lagi di host db.</text>
<text x="660" y="440" font-size="13.5" fill="#9d2c13">r2-fwd-drop naik, db-in-drop naik.</text>

<text x="660" y="472" font-size="15" font-weight="bold" fill="#16191c">B. Spoofing alamat privat</text>
<text x="660" y="494" font-size="14" fill="#16191c">source 192.168.10.x masuk lewat out0</text>
<g stroke="#9d2c13" stroke-width="2.5" stroke-dasharray="9 7" fill="none" marker-end="url(#arx)">
  <path d="M662 508 L880 508"/>
</g>
<text x="890" y="513" font-size="18" font-weight="bold" fill="#9d2c13">✗</text>
<text x="660" y="532" font-size="13.5" fill="#9d2c13">Gagal di chain antispoof r1, counter bogon naik.</text>

<line x1="40" y1="632" x2="1560" y2="632" stroke="#c9cfd4" stroke-width="2"/>

<!-- ============ ALLOWED FLOWS ============ -->
<text x="40" y="664" font-size="17" font-weight="bold" fill="#1d3557">ALLOWED FLOWS · satu baris per aliran, dengan port dan rule yang mengizinkan</text>

<g font-size="14.5" fill="#16191c">
  <text x="40"  y="696" font-weight="bold">1</text>
  <text x="68"  y="696" font-weight="bold">OUTSIDE → DMZ</text>
  <text x="285" y="696">tcp 80, 443 ke web saja</text>
  <text x="560" y="696" fill="#3c4650">iifname out0 oifname dmz0 ip daddr $WEB tcp dport { 80, 443 } accept</text>

  <text x="40"  y="724" font-weight="bold">2</text>
  <text x="68"  y="724" font-weight="bold">INSIDE → OUTSIDE</text>
  <text x="285" y="724">tcp 80, 443, 587 · icmp</text>
  <text x="560" y="724" fill="#3c4650">iifname in0 oifname out0 tcp dport { 80, 443, 587 } accept</text>

  <text x="68"  y="752" font-weight="bold">INSIDE → OUTSIDE</text>
  <text x="285" y="752">dns 53, ntp 123</text>
  <text x="560" y="752" fill="#3c4650">… ip daddr $INTERNET th dport 53 accept  ·  udp dport 123 accept</text>

  <text x="68"  y="780" font-weight="bold">INSIDE → DMZ</text>
  <text x="285" y="780">tcp 80, 443</text>
  <text x="560" y="780" fill="#3c4650">iifname in0 oifname dmz0 ip daddr $WEB tcp dport { 80, 443 } accept</text>

  <text x="40"  y="808" font-weight="bold">3</text>
  <text x="68"  y="808" font-weight="bold">MGMT → DMZ</text>
  <text x="285" y="808">tcp 80, 443, 8443</text>
  <text x="560" y="808" fill="#3c4650">iifname mgmt0 oifname dmz0 ip daddr $WEB tcp dport { 80, 443, 8443 } accept</text>

  <text x="68"  y="836" font-weight="bold">MGMT → DMZ</text>
  <text x="285" y="836">tcp 22 hanya dari bastion</text>
  <text x="560" y="836" fill="#3c4650">… ip saddr $BASTION ip daddr $WEB tcp dport 22 accept</text>

  <text x="68"  y="864" font-weight="bold">MGMT → OUTSIDE</text>
  <text x="285" y="864">tcp 80, 443 · dns 53 · ntp 123</text>
  <text x="560" y="864" fill="#3c4650">iifname mgmt0 oifname out0 tcp dport { 80, 443 } accept</text>

  <text x="40"  y="892" font-weight="bold">4</text>
  <text x="68"  y="892" font-weight="bold">DMZ → OUTSIDE</text>
  <text x="285" y="892">tcp 80, 443 · udp 53, 123</text>
  <text x="560" y="892" fill="#3c4650">ip saddr $WEB ip daddr $INTERNET … (hanya ke server yang dikenal)</text>

  <text x="40"  y="920" font-weight="bold">5</text>
  <text x="68"  y="920" font-weight="bold">DMZ → DATA</text>
  <text x="285" y="920">tcp 3306, web ke db saja</text>
  <text x="560" y="920" fill="#3c4650">r2: iifname dmz0 oifname data0 ip saddr $WEB ip daddr $DB tcp dport 3306 accept</text>

  <text x="40"  y="948" font-weight="bold">7</text>
  <text x="68"  y="948" font-weight="bold">MGMT → DATA</text>
  <text x="285" y="948">tcp 22 dari bastion · icmp</text>
  <text x="560" y="948" fill="#3c4650">r2: … ip saddr $BASTION ip daddr $DB tcp dport 22 accept</text>

  <text x="40"  y="976" font-weight="bold">6</text>
  <text x="68"  y="976" font-weight="bold">Lapis kedua di db</text>
  <text x="285" y="976">3306 dari web · 22 dari bastion</text>
  <text x="560" y="976" fill="#3c4650">db: ip saddr 172.16.10.10 tcp dport 3306 accept</text>

  <text x="68"  y="1004" font-weight="bold">Dalam zona sama</text>
  <text x="285" y="1004">semua</text>
  <text x="560" y="1004" fill="#3c4650">iifname X oifname X accept  ·  ct state established,related accept</text>
</g>

