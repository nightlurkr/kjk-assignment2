<!-- ============ ALLOWED FLOWS ============ -->
<text x="40" y="774" font-size="17" font-weight="bold" fill="#1d3557">ALLOWED FLOWS · satu baris per aliran, dengan port dan rule yang mengizinkan</text>

<g font-size="14.5" fill="#16191c">
  <text x="40"  y="806" font-weight="bold">OUTSIDE → DMZ</text>
  <text x="275" y="806">tcp 80, 443 ke web saja</text>
  <text x="560" y="806" fill="#3c4650">r1: iifname out0 oifname dmz0 ip daddr $WEB tcp dport { 80, 443 } accept</text>

  <text x="40"  y="834" font-weight="bold">INSIDE → OUTSIDE</text>
  <text x="275" y="834">tcp 80, 443, 587 · icmp</text>
  <text x="560" y="834" fill="#3c4650">r1: iifname in0 oifname out0 tcp dport { 80, 443, 587 } accept</text>

  <text x="40"  y="862" font-weight="bold">INSIDE → OUTSIDE</text>
  <text x="275" y="862">dns 53, ntp 123</text>
  <text x="560" y="862" fill="#3c4650">r1: … ip daddr $INTERNET th dport 53 accept  ·  udp dport 123 accept</text>

  <text x="40"  y="890" font-weight="bold">INSIDE → DMZ</text>
  <text x="275" y="890">tcp 80, 443</text>
  <text x="560" y="890" fill="#3c4650">r1: iifname in0 oifname dmz0 ip daddr $WEB tcp dport { 80, 443 } accept</text>

  <text x="40"  y="918" font-weight="bold">MGMT → DMZ</text>
  <text x="275" y="918">tcp 80, 443, 8443</text>
  <text x="560" y="918" fill="#3c4650">r1: iifname mgmt0 oifname dmz0 ip daddr $WEB tcp dport { 80, 443, 8443 } accept</text>

  <text x="40"  y="946" font-weight="bold">MGMT → DMZ</text>
  <text x="275" y="946">tcp 22 hanya dari bastion</text>
  <text x="560" y="946" fill="#3c4650">r1: … ip saddr $BASTION ip daddr $WEB tcp dport 22 accept</text>

  <text x="40"  y="974" font-weight="bold">MGMT → OUTSIDE</text>
  <text x="275" y="974">tcp 80, 443 · dns 53 · ntp 123</text>
  <text x="560" y="974" fill="#3c4650">r1: iifname mgmt0 oifname out0 tcp dport { 80, 443 } accept</text>

  <text x="40"  y="1002" font-weight="bold">DMZ → OUTSIDE</text>
  <text x="275" y="1002">tcp 80, 443 · udp 53, 123</text>
  <text x="560" y="1002" fill="#3c4650">r1: ip saddr $WEB ip daddr $INTERNET …  (hanya ke server yang dikenal)</text>

  <text x="40"  y="1030" font-weight="bold">DMZ → DATA</text>
  <text x="275" y="1030">tcp 3306, web ke db saja</text>
  <text x="560" y="1030" fill="#3c4650">r2: iifname dmz0 oifname data0 ip saddr $WEB ip daddr $DB tcp dport 3306 accept</text>

  <text x="40"  y="1058" font-weight="bold">MGMT → DATA</text>
  <text x="275" y="1058">tcp 22 dari bastion · icmp</text>
  <text x="560" y="1058" fill="#3c4650">r2: … ip saddr $BASTION ip daddr $DB tcp dport 22 accept</text>

  <text x="40"  y="1086" font-weight="bold">MGMT → r1, r2</text>
  <text x="275" y="1086">tcp 22 dari bastion · icmp</text>
  <text x="560" y="1086" fill="#3c4650">r1/r2 input: iifname mgmt0 ip saddr $BASTION tcp dport 22 accept</text>

  <text x="40"  y="1114" font-weight="bold">Lapis kedua di db</text>
  <text x="275" y="1114">3306 dari web · 22 dari bastion</text>
  <text x="560" y="1114" fill="#3c4650">db: ip saddr 172.16.10.10 tcp dport 3306 accept  ·  output policy drop</text>

  <text x="40"  y="1142" font-weight="bold">Dalam zona sama</text>
  <text x="275" y="1142">semua</text>
  <text x="560" y="1142" fill="#3c4650">bridge, tidak melewati firewall  ·  balasan: ct state established,related accept</text>
</g>

<line x1="40" y1="1170" x2="1560" y2="1170" stroke="#c9cfd4" stroke-width="2"/>

