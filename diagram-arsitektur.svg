<text x="374" y="278" font-size="13.5" fill="#d6e2ee">in0    192.168.10.1</text>
<text x="374" y="300" font-size="13.5" fill="#d6e2ee">dmz0   172.16.10.1</text>
<text x="374" y="322" font-size="13.5" fill="#d6e2ee">mgmt0  192.168.99.1</text>
<text x="374" y="350" font-size="13" fill="#f2c14e">antispoof · policy drop</text>

<!-- DMZ segmen bersama -->
<rect x="620" y="118" width="400" height="130" rx="8" fill="#eef2f6" stroke="#7d8a96" stroke-width="2"/>
<text x="638" y="146" font-size="19" font-weight="bold" fill="#16191c">DMZ · segmen dmz0</text>
<text x="638" y="170" font-size="15" fill="#16191c">172.16.10.0/24  ·  web .10  (22, 80, 443, 8443)</text>
<text x="638" y="200" font-size="14" fill="#5a6168">Segmen bersama. Yang menempel di sini:</text>
<text x="638" y="222" font-size="14" fill="#5a6168">web .10   ·   r1 dmz0 .1   ·   r2 dmz0 .2</text>

<!-- INSIDE: di sisi dalam r1, berseberangan dengan OUTSIDE -->
<rect x="620" y="268" width="400" height="100" rx="8" fill="#eef2f6" stroke="#7d8a96" stroke-width="2"/>
<text x="638" y="296" font-size="19" font-weight="bold" fill="#16191c">INSIDE · in0</text>
<text x="638" y="320" font-size="15" fill="#16191c">192.168.10.0/24</text>
<text x="638" y="344" font-size="15" fill="#16191c">staff .50  (445)</text>

<!-- r2 -->
<rect x="1100" y="196" width="180" height="180" rx="8" fill="#1d3557"/>
<text x="1119" y="228" font-size="23" font-weight="bold" fill="#ffffff">r2</text>
<text x="1119" y="256" font-size="13.5" fill="#d6e2ee">dmz0   172.16.10.2</text>
<text x="1119" y="278" font-size="13.5" fill="#d6e2ee">mgmt0  192.168.99.2</text>
<text x="1119" y="300" font-size="13.5" fill="#d6e2ee">data0  172.16.20.1</text>
<text x="1119" y="330" font-size="13" fill="#f2c14e">policy drop</text>
<text x="1119" y="352" font-size="12.5" fill="#f2c14e">default via 172.16.10.1</text>

<!-- DATA -->
<rect x="1345" y="206" width="215" height="140" rx="8" fill="#eef2f6" stroke="#7d8a96" stroke-width="2"/>
<text x="1363" y="234" font-size="19" font-weight="bold" fill="#16191c">DATA · data0</text>
<text x="1363" y="258" font-size="15" fill="#16191c">172.16.20.0/24</text>
<text x="1363" y="282" font-size="15" fill="#16191c">db .10  (22, 3306)</text>
<text x="1363" y="312" font-size="13.5" font-weight="bold" fill="#9d2c13">firewall host sendiri:</text>
<text x="1363" y="332" font-size="12.5" font-weight="bold" fill="#9d2c13">inet db · in + out drop</text>

<!-- kotak serangan -->
<rect x="620" y="388" width="400" height="152" rx="8" fill="#fdf0ec" stroke="#9d2c13" stroke-width="2"/>
<text x="638" y="414" font-size="15.5" font-weight="bold" fill="#9d2c13">BLOCKED ATTACKS · before / after</text>
<text x="638" y="440" font-size="14" font-weight="bold" fill="#16191c">A. attacker .66 → staff 192.168.10.50:445</text>
<text x="638" y="460" font-size="13" fill="#16191c">sebelum: succeeded!    sesudah: timed out</text>
<text x="638" y="488" font-size="14" font-weight="bold" fill="#16191c">B. web .10 → attacker 203.0.113.66:4444</text>
<text x="638" y="508" font-size="13" fill="#16191c">sebelum: succeeded!    sesudah: timed out</text>
<text x="638" y="530" font-size="12.5" fill="#9d2c13">Keduanya tertangkap r1-fwd-drop, counter naik.</text>

<!-- catatan topologi -->
<text x="620" y="566" font-size="13.5" fill="#5a6168">r1 dan r2 sama-sama menempel pada segmen DMZ dan MGMT.</text>
<text x="620" y="584" font-size="13.5" fill="#5a6168">Trafik INSIDE/OUTSIDE ke DATA lewat r1 lalu r2, kedua ruleset harus setuju.</text>

