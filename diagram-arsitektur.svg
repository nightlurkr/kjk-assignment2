<text x="40" y="1200" font-size="17" font-weight="bold" fill="#9d2c13">ARAH YANG DITUTUP · tidak ada rule, tertangkap policy drop</text>
<g font-size="14.5" fill="#16191c">
  <text x="40" y="1228">OUTSIDE → INSIDE, MGMT, DATA</text>
  <text x="40" y="1252">DMZ → INSIDE, MGMT   (web yang diretas tidak bisa pivot ke dalam)</text>
  <text x="40" y="1276">DATA → semua arah   (db tidak pernah memulai koneksi keluar)</text>
  <text x="40" y="1300">INSIDE → DATA, MGMT   ·   source palsu dari out0 (chain antispoof)</text>
</g>

