<!-- kotak serangan -->
<rect x="620" y="268" width="400" height="152" rx="8" fill="#fdf0ec" stroke="#9d2c13" stroke-width="2"/>
<text x="638" y="294" font-size="15.5" font-weight="bold" fill="#9d2c13">BLOCKED ATTACKS · before / after</text>
<text x="638" y="320" font-size="14" font-weight="bold" fill="#16191c">A. attacker .66 → staff 192.168.10.50:445</text>
<text x="638" y="340" font-size="13" fill="#16191c">sebelum: succeeded!    sesudah: timed out</text>
<text x="638" y="368" font-size="14" font-weight="bold" fill="#16191c">B. web .10 → attacker 203.0.113.66:4444</text>
<text x="638" y="388" font-size="13" fill="#16191c">sebelum: succeeded!    sesudah: timed out</text>
<text x="638" y="410" font-size="12.5" fill="#9d2c13">Keduanya tertangkap r1-fwd-drop, counter naik.</text>

<line x1="40" y1="612" x2="1560" y2="612" stroke="#c9cfd4" stroke-width="2"/>

<!-- ============ ALLOWED FLOWS ============ -->
<text x="40" y="644" font-size="17" font-weight="bold" fill="#1d3557">ALLOWED FLOWS · satu baris per aliran, dengan port dan rule yang mengizinkan</text>

<g font-size="14.5" fill="#16191c">
  <text x="40"  y="676" font-weight="bold">OUTSIDE → DMZ</text>
  <text x="275" y="676">tcp 80, 443 ke web saja</text>
  <text x="560" y="676" fill="#3c4650">r1: iifname out0 oifname dmz0 ip daddr $WEB tcp dport { 80, 443 } accept</text>

  <text x="40"  y="704" font-weight="bold">INSIDE → OUTSIDE</text>
  <text x="275" y="704">tcp 80, 443, 587 · icmp</text>
  <text x="560" y="704" fill="#3c4650">r1: iifname in0 oifname out0 tcp dport { 80, 443, 587 } accept</text>

  <text x="40"  y="732" font-weight="bold">INSIDE → OUTSIDE</text>
  <text x="275" y="732">dns 53, ntp 123</text>
  <text x="560" y="732" fill="#3c4650">r1: … ip daddr $INTERNET th dport 53 accept  ·  udp dport 123 accept</text>

  <text x="40"  y="760" font-weight="bold">INSIDE → DMZ</text>
  <text x="275" y="760">tcp 80, 443</text>
  <text x="560" y="760" fill="#3c4650">r1: iifname in0 oifname dmz0 ip daddr $WEB tcp dport { 80, 443 } accept</text>

  <text x="40"  y="788" font-weight="bold">MGMT → DMZ</text>
  <text x="275" y="788">tcp 80, 443, 8443</text>
  <text x="560" y="788" fill="#3c4650">r1: iifname mgmt0 oifname dmz0 ip daddr $WEB tcp dport { 80, 443, 8443 } accept</text>

  <text x="40"  y="816" font-weight="bold">MGMT → DMZ</text>
  <text x="275" y="816">tcp 22 hanya dari bastion</text>
  <text x="560" y="816" fill="#3c4650">r1: … ip saddr $BASTION ip daddr $WEB tcp dport 22 accept</text>

  <text x="40"  y="844" font-weight="bold">MGMT → OUTSIDE</text>
  <text x="275" y="844">tcp 80, 443 · dns 53 · ntp 123</text>
  <text x="560" y="844" fill="#3c4650">r1: iifname mgmt0 oifname out0 tcp dport { 80, 443 } accept</text>

  <text x="40"  y="872" font-weight="bold">DMZ → OUTSIDE</text>
  <text x="275" y="872">tcp 80, 443 · udp 53, 123</text>
  <text x="560" y="872" fill="#3c4650">r1: ip saddr $WEB ip daddr $INTERNET …  (hanya ke server yang dikenal)</text>

  <text x="40"  y="900" font-weight="bold">DMZ → DATA</text>
  <text x="275" y="900">tcp 3306, web ke db saja</text>
  <text x="560" y="900" fill="#3c4650">r2: iifname dmz0 oifname data0 ip saddr $WEB ip daddr $DB tcp dport 3306 accept</text>

  <text x="40"  y="928" font-weight="bold">MGMT → DATA</text>
  <text x="275" y="928">tcp 22 dari bastion · icmp</text>
  <text x="560" y="928" fill="#3c4650">r2: … ip saddr $BASTION ip daddr $DB tcp dport 22 accept</text>

  <text x="40"  y="956" font-weight="bold">Lapis kedua di db</text>
  <text x="275" y="956">3306 dari web · 22 dari bastion</text>
  <text x="560" y="956" fill="#3c4650">db: ip saddr 172.16.10.10 tcp dport 3306 accept</text>

  <text x="40"  y="984" font-weight="bold">Dalam zona sama</text>
  <text x="275" y="984">semua</text>
  <text x="560" y="984" fill="#3c4650">r1: iifname X oifname X accept  ·  ct state established,related accept</text>
</g>

<line x1="40" y1="1012" x2="1560" y2="1012" stroke="#c9cfd4" stroke-width="2"/>

<!-- ============ ARAH DITUTUP + TEAM ============ -->
<text x="40" y="1042" font-size="17" font-weight="bold" fill="#9d2c13">ARAH YANG DITUTUP · tidak ada rule, tertangkap policy drop</text>
<g font-size="14.5" fill="#16191c">
  <text x="40" y="1070">OUTSIDE → INSIDE, MGMT, DATA</text>
  <text x="40" y="1094">DMZ → INSIDE, MGMT   (web yang diretas tidak bisa pivot ke dalam)</text>
  <text x="40" y="1118">DATA → semua arah   (db tidak pernah memulai koneksi keluar)</text>
  <text x="40" y="1142">INSIDE → DATA, MGMT   ·   source palsu dari out0 (chain antispoof)</text>
</g>

